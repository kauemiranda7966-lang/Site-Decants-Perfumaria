services:
  - type: web
    name: decants-perfumaria
    runtime: python
    plan: starter
    region: oregon
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /api/products
    disk:
      name: decants-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DECANTS_DB_PATH
        value: /var/data/decants.sqlite3
      - key: DECANTS_UPLOAD_DIR
        value: /var/data/uploads
      - key: DECANTS_PRIVATE_UPLOAD_DIR
        value: /var/data/private-uploads
      - key: DECANTS_SQLITE_BACKUP_DIR
        value: /var/data/backups
      - key: DECANTS_SQLITE_BACKUP_INTERVAL_HOURS
        value: 24
      - key: DECANTS_SQLITE_BACKUP_RETENTION_DAYS
        value: 7
      - key: DECANTS_MAX_REQUEST_THREADS
        value: 64
      - key: DECANTS_RETENTION_ORDER_DAYS
        value: 1825
      - key: DECANTS_RETENTION_LEAD_DAYS
        value: 730
      - key: DECANTS_RETENTION_LOG_DAYS
        value: 365
      - key: DECANTS_RETENTION_ATTACHMENT_DAYS
        value: 180
      - key: DECANTS_BUSINESS_TRADE_NAME
        value: Decant's Perfumaria
      - key: DECANTS_BUSINESS_LEGAL_NAME
        sync: false
      - key: DECANTS_BUSINESS_TAX_ID
        sync: false
      - key: DECANTS_BUSINESS_ADDRESS
        sync: false
      - key: DECANTS_BUSINESS_POSTAL_CODE
        sync: false
      - key: DECANTS_BUSINESS_EMAIL
        sync: false
      - key: DECANTS_FREE_SHIPPING_THRESHOLD
        value: 300
      - key: DECANTS_WHATSAPP_NUMBER
        value: 558899641605
      - key: DECANTS_SECRET_KEY
        generateValue: true
      - key: DECANTS_ENV
        value: production
      - key: DECANTS_ADMIN_DOMAIN
        value: site-decants-perfumaria.onrender.com
      - key: DECANTS_PUBLIC_BASE_URL
        value: https://site-decants-perfumaria.onrender.com
      - key: DECANTS_ADMIN_USER
        sync: false
      - key: DECANTS_ADMIN_PASSWORD_HASH
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADO_PAGO_COLLECTOR_ID
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_MAX_AGE_SECONDS
        value: 300
